<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gammamarkets Sketch 002 — Order Operations</title>
  <link id="theme-link" rel="stylesheet" href="../themes/default.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding-top: 58px; background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: var(--text-sm); }
    button, input, select { font: inherit; }
    button { min-height: 40px; border: 0; border-radius: var(--radius-md); cursor: pointer; transition: all 0.15s ease; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 6px; font-size: var(--text-2xl); letter-spacing: -0.03em; }
    h2 { font-size: var(--text-xl); letter-spacing: -0.02em; }
    h3 { font-size: var(--text-base); }
    .variant-nav { position: fixed; inset: 0 0 auto; z-index: 1000; min-height: 58px; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-4); overflow-x: auto; background: color-mix(in srgb, var(--color-surface) 95%, transparent); border-bottom: 1px solid var(--color-border); backdrop-filter: blur(12px); }
    .variant-tab { padding: 0 var(--space-4); color: var(--color-text-muted); background: transparent; white-space: nowrap; }
    .variant-tab:hover { background: var(--color-surface-alt); color: var(--color-text); }
    .variant-tab.active { color: var(--color-on-primary); background: var(--color-primary); }
    #sketch-frame { width: 100%; margin: 0 auto; transition: max-width 0.2s ease; }
    .variant { display: none; min-height: calc(100vh - 58px); }
    .variant.active { display: block; }
    .admin-shell { min-height: calc(100vh - 58px); display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .sidebar { padding: var(--space-4); background: var(--color-surface); border-right: 1px solid var(--color-border); }
    .brand { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-8); font-weight: 800; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; color: var(--color-on-primary); background: var(--color-primary); border-radius: 10px 10px 10px 3px; }
    .merchant { margin-bottom: var(--space-4); padding: var(--space-3); background: var(--color-surface-alt); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .merchant strong, .merchant small { display: block; }
    .merchant small { margin-top: 3px; color: var(--color-text-muted); }
    .side-nav { display: grid; gap: 3px; }
    .side-nav button { display: flex; align-items: center; justify-content: flex-start; gap: var(--space-3); padding: 0 var(--space-3); color: var(--color-text-muted); background: transparent; text-align: left; }
    .side-nav button:hover, .side-nav button.active { color: var(--color-text); background: var(--color-surface-alt); }
    .side-nav button.active { box-shadow: inset 3px 0 var(--color-primary); }
    .main { min-width: 0; }
    .page-header { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
    .page-header p { margin: 0; color: var(--color-text-muted); }
    .header-actions { display: flex; gap: var(--space-2); }
    .primary { padding: 0 var(--space-4); color: var(--color-on-primary); background: var(--color-primary); font-weight: 760; }
    .primary:hover { background: var(--color-primary-hover); }
    .secondary { padding: 0 var(--space-4); color: var(--color-text); background: var(--color-surface-alt); border: 1px solid var(--color-border); }
    .secondary:hover { border-color: var(--color-primary); }
    .mobile-back { display: none; margin-bottom: var(--space-4); }
    .danger { color: var(--color-danger); }
    .workspace { min-height: calc(100vh - 134px); display: grid; grid-template-columns: 390px minmax(0, 1fr); }
    .order-panel { min-width: 0; background: var(--color-surface); border-right: 1px solid var(--color-border); }
    .filters { display: grid; grid-template-columns: 1fr 132px; gap: var(--space-2); padding: var(--space-3); border-bottom: 1px solid var(--color-border); }
    .filters input, .filters select { width: 100%; min-height: 40px; padding: 0 var(--space-3); color: var(--color-text); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .order-list { max-height: calc(100vh - 192px); overflow: auto; }
    .order-row { width: 100%; min-height: 94px; display: grid; grid-template-columns: 1fr auto; gap: var(--space-3); padding: var(--space-3) var(--space-4); color: var(--color-text); background: transparent; border-bottom: 1px solid var(--color-border); border-radius: 0; text-align: left; }
    .order-row:hover { background: var(--color-surface-alt); }
    .order-row.active { background: color-mix(in srgb, var(--color-primary) 10%, var(--color-surface)); box-shadow: inset 3px 0 var(--color-primary); }
    .row-title { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 5px; font-weight: 780; }
    .row-meta { color: var(--color-text-muted); font-size: var(--text-xs); line-height: 1.55; }
    .row-total { font-weight: 800; text-align: right; }
    .protocol { display: inline-flex; padding: 3px 6px; color: var(--color-info); background: color-mix(in srgb, var(--color-info) 12%, var(--color-surface)); border-radius: var(--radius-sm); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: var(--radius-full); font-size: var(--text-xs); font-weight: 760; white-space: nowrap; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.confirmed, .status.processing, .status.shipped { color: var(--color-success); background: color-mix(in srgb, var(--color-success) 12%, var(--color-surface)); }
    .status.awaiting { color: var(--color-warning); background: color-mix(in srgb, var(--color-warning) 12%, var(--color-surface)); }
    .status.exception { color: var(--color-danger); background: color-mix(in srgb, var(--color-danger) 12%, var(--color-surface)); }
    .status.cancelled { color: var(--color-text-muted); background: var(--color-surface-alt); }
    .detail { min-width: 0; padding: clamp(18px, 3vw, 40px); overflow: auto; }
    .detail-card { max-width: 900px; margin: 0 auto; }
    .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
    .detail-heading p { color: var(--color-text-muted); }
    .action-row { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .alert { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); padding: var(--space-4); border: 1px solid color-mix(in srgb, var(--color-danger) 50%, var(--color-border)); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-danger) 8%, var(--color-surface)); }
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); margin-bottom: var(--space-6); }
    .metric { padding: var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
    .metric span { display: block; margin-bottom: 5px; color: var(--color-text-muted); font-size: var(--text-xs); }
    .metric strong { font-size: var(--text-lg); }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(240px, 0.6fr); gap: var(--space-4); }
    .panel { padding: var(--space-5, 20px); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .panel + .panel { margin-top: var(--space-4); }
    .item { display: grid; grid-template-columns: 52px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--color-border); }
    .item:last-child { border: 0; }
    .item-art { width: 52px; height: 52px; background: linear-gradient(145deg, var(--color-surface-alt), color-mix(in srgb, var(--color-accent) 22%, var(--color-surface))); border-radius: var(--radius-md); }
    .kv { display: grid; grid-template-columns: 115px 1fr; gap: var(--space-2); padding: 7px 0; }
    .kv span:first-child { color: var(--color-text-muted); }
    .timeline { position: relative; }
    .event { position: relative; padding: 0 0 var(--space-5, 20px) 30px; }
    .event::before { content: ""; position: absolute; left: 3px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: var(--color-primary); }
    .event:not(:last-child)::after { content: ""; position: absolute; left: 8px; top: 17px; bottom: 3px; width: 2px; background: var(--color-border); }
    .event time { display: block; color: var(--color-text-muted); font-size: var(--text-xs); }
    details { border-top: 1px solid var(--color-border); }
    summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; color: var(--color-text-muted); font-weight: 700; }
    .technical { padding: 0 0 var(--space-3); color: var(--color-text-muted); font: var(--text-xs)/1.6 var(--font-mono); overflow-wrap: anywhere; }
    .board { padding: var(--space-4); display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: var(--space-3); overflow-x: auto; }
    .column { min-height: 520px; padding: var(--space-3); background: color-mix(in srgb, var(--color-surface-alt) 70%, transparent); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
    .column-head { display: flex; justify-content: space-between; margin-bottom: var(--space-3); font-weight: 800; }
    .count { min-width: 24px; height: 24px; display: grid; place-items: center; color: var(--color-text-muted); background: var(--color-surface); border-radius: var(--radius-full); font-size: var(--text-xs); }
    .order-card { width: 100%; margin-bottom: var(--space-2); padding: var(--space-3); color: var(--color-text); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); text-align: left; }
    .order-card:hover { border-color: var(--color-primary); transform: translateY(-1px); }
    .card-top { display: flex; justify-content: space-between; gap: var(--space-2); margin-bottom: var(--space-3); }
    .drawer-backdrop { position: fixed; inset: 58px 0 0; z-index: 800; display: none; background: rgba(0,0,0,0.28); }
    .drawer-backdrop.open { display: block; }
    .drawer { position: absolute; inset: 0 0 0 auto; width: min(720px, 92vw); padding: var(--space-6); overflow: auto; background: var(--color-bg); box-shadow: var(--shadow-lg); }
    .drawer-close { float: right; width: 40px; padding: 0; }
    .timeline-workspace { min-height: calc(100vh - 134px); display: grid; grid-template-columns: 290px minmax(0, 1fr); }
    .queue-rail { padding: var(--space-3); background: var(--color-surface); border-right: 1px solid var(--color-border); }
    .queue-button { width: 100%; margin-bottom: var(--space-2); padding: var(--space-3); color: var(--color-text); background: transparent; border: 1px solid transparent; text-align: left; }
    .queue-button:hover, .queue-button.active { background: var(--color-surface-alt); border-color: var(--color-border); }
    .queue-button strong, .queue-button span { display: block; }
    .queue-button span { margin-top: 4px; color: var(--color-text-muted); font-size: var(--text-xs); }
    .empty-state, .error-state { margin: var(--space-8); padding: var(--space-12); text-align: center; color: var(--color-text-muted); background: var(--color-surface); border: 1px dashed var(--color-border); border-radius: var(--radius-lg); }
    #sketch-tools { position: fixed; right: 12px; bottom: 12px; z-index: 1200; max-width: calc(100vw - 24px); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 10px; color: white; background: rgba(9,12,16,.9); border: 1px solid rgba(255,255,255,.2); border-radius: 10px; font: 12px system-ui; opacity: .52; transition: opacity .2s; }
    #sketch-tools:hover, #sketch-tools:focus-within { opacity: 1; }
    #sketch-tools button, #sketch-tools select { min-height: 32px; padding: 0 8px; color: white; background: #222a34; border: 1px solid #59697c; border-radius: 6px; }
    #toast { position: fixed; left: 50%; bottom: 70px; z-index: 1300; transform: translate(-50%, 20px); padding: 11px 16px; color: var(--color-on-primary); background: var(--color-primary); border-radius: var(--radius-full); opacity: 0; pointer-events: none; transition: all .2s; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #annotation-tip { position: fixed; z-index: 1400; display: none; padding: 7px 9px; color: #fff; background: #111; border-radius: 6px; font: 11px/1.35 var(--font-mono); pointer-events: none; }
    body.annotations-on [data-annotate] { outline: 1px dashed var(--color-focus); outline-offset: 2px; }
    #sketch-frame.preview-tablet .admin-shell { grid-template-columns: 72px minmax(0,1fr); }
    #sketch-frame.preview-tablet .sidebar .brand span:last-child, #sketch-frame.preview-tablet .merchant, #sketch-frame.preview-tablet .side-nav button span { display: none; }
    #sketch-frame.preview-tablet .side-nav button { justify-content: center; }
    #sketch-frame.preview-tablet .workspace { grid-template-columns: 320px minmax(0,1fr); }
    #sketch-frame.preview-tablet .metrics { grid-template-columns: repeat(2,1fr); }
    #sketch-frame.preview-tablet .detail-grid { grid-template-columns: 1fr; }
    #sketch-frame.preview-mobile .admin-shell { grid-template-columns: 1fr; }
    #sketch-frame.preview-mobile .sidebar { display: none; }
    #sketch-frame.preview-mobile .workspace, #sketch-frame.preview-mobile .timeline-workspace { grid-template-columns: 1fr; }
    #sketch-frame.preview-mobile .detail, #sketch-frame.preview-mobile .timeline-focus { display: none; }
    #sketch-frame.preview-mobile #variant-a.mobile-detail-open .order-panel, #sketch-frame.preview-mobile #variant-c.mobile-detail-open .queue-rail { display: none; }
    #sketch-frame.preview-mobile #variant-a.mobile-detail-open .detail, #sketch-frame.preview-mobile #variant-c.mobile-detail-open .timeline-focus { display: block; }
    #sketch-frame.preview-mobile .mobile-detail-open .mobile-back { display: inline-flex; align-items: center; }
    #sketch-frame.preview-mobile .filters { grid-template-columns: 1fr; }
    #sketch-frame.preview-mobile .order-panel, #sketch-frame.preview-mobile .queue-rail { border: 0; }
    #sketch-frame.preview-mobile .board { grid-template-columns: 1fr; overflow: visible; }
    #sketch-frame.preview-mobile .column { min-height: 0; }
    @media (max-width: 820px) { .admin-shell { grid-template-columns: 72px minmax(0,1fr); } .sidebar .brand span:last-child, .merchant, .side-nav button span { display:none; } .side-nav button { justify-content:center; } .workspace { grid-template-columns:320px minmax(0,1fr); } .metrics { grid-template-columns:repeat(2,1fr); } .detail-grid { grid-template-columns:1fr; } }
    @media (max-width: 560px) { .admin-shell { grid-template-columns:1fr; } .sidebar { display:none; } .workspace, .timeline-workspace { grid-template-columns:1fr; } .detail, .timeline-focus { display:none; } #variant-a.mobile-detail-open .order-panel, #variant-c.mobile-detail-open .queue-rail { display:none; } #variant-a.mobile-detail-open .detail, #variant-c.mobile-detail-open .timeline-focus { display:block; } .mobile-detail-open .mobile-back { display:inline-flex; align-items:center; } .filters { grid-template-columns:1fr; } .page-header { padding:var(--space-3); } .header-actions { display:none; } .board { grid-template-columns:1fr; overflow:visible; } .column { min-height:0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration:.001ms !important; } }
  </style>
</head>
<body>
  <nav class="variant-nav" aria-label="Sketch variants"><button class="variant-tab active" data-variant-tab="a" onclick="showVariant('a',this)">A: Linear Split ★ Selected</button><button class="variant-tab" data-variant-tab="b" onclick="showVariant('b',this)">B: Queue Board</button><button class="variant-tab" data-variant-tab="c" onclick="showVariant('c',this)">C: Timeline Focus</button></nav>
  <main id="sketch-frame">
    <section id="variant-a" class="variant active" aria-label="Variant A Linear Split"><div class="admin-shell"><aside class="sidebar"></aside><div class="main"><header class="page-header"><div><h1>Orders</h1><p>Four active orders · one needs attention</p></div><div class="header-actions"><button class="secondary" onclick="toast('Export prepared')">Export</button><button class="primary" onclick="focusException()">Review exception</button></div></header><div class="workspace"><div class="order-panel"><div class="filters"><input data-search="a" aria-label="Search orders" placeholder="Search order or buyer" oninput="setSearch(this.value)"><select data-filter="a" aria-label="Filter by status" onchange="setFilter(this.value)"><option value="all">All states</option><option value="confirmed">Confirmed</option><option value="awaiting">Awaiting payment</option><option value="exception">Needs attention</option><option value="cancelled">Cancelled</option></select></div><div class="order-list" data-list="a"></div></div><div class="detail" data-detail="a" data-annotate></div></div></div></div></section>
    <section id="variant-b" class="variant" aria-label="Variant B Queue Board"><div class="admin-shell"><aside class="sidebar"></aside><div class="main"><header class="page-header"><div><h1>Order queues</h1><p>Work by state, open details only when needed</p></div><div class="header-actions"><button class="secondary" onclick="cycleDataMode()">Cycle data state</button><button class="primary" onclick="focusException()">Open attention queue</button></div></header><div class="board" data-board="b"></div></div></div><div class="drawer-backdrop" data-drawer onclick="closeDrawer(event)"><aside class="drawer"><button class="secondary drawer-close" aria-label="Close order drawer" onclick="closeDrawer(event,true)">×</button><div data-detail="b"></div></aside></div></section>
    <section id="variant-c" class="variant" aria-label="Variant C Timeline Focus"><div class="admin-shell"><aside class="sidebar"></aside><div class="main"><header class="page-header"><div><h1>Order history</h1><p>Payment, inventory, fulfillment, and audit in one chronology</p></div><div class="header-actions"><button class="secondary" onclick="cycleDataMode()">Cycle data state</button><button class="primary" onclick="advanceSelected('processing')">Advance selected</button></div></header><div class="timeline-workspace"><aside class="queue-rail" data-rail="c"></aside><div class="detail timeline-focus" data-detail="c" data-annotate></div></div></div></div></section>
  </main>
  <div id="toast" role="status" aria-live="polite"></div><div id="annotation-tip"></div>
  <div id="sketch-tools"><label for="theme-switcher">Theme</label><select id="theme-switcher" onchange="setTheme(this.value)"><option value="default.css">Warm Market</option><option value="clean-minimal.css">Clean Minimal</option><option value="high-contrast.css">High Contrast</option></select><button onclick="setViewport(375)">375</button><button onclick="setViewport(768)">768</button><button onclick="setViewport(1280)">1280</button><button onclick="setViewport(null)">Full</button><button id="annotations" onclick="toggleAnnotations()">Annotations</button><button onclick="cycleDataMode()">Data state</button><button onclick="resetData()">Reset</button></div>
  <script>
    const originalOrders = [
      {id:'NRG-1042',channel:'Web',buyer:'buyer@example.com',state:'confirmed',label:'Confirmed',total:51500,item:'Hand-thrown Nostr Mug',variant:'Sand / 12 oz',qty:1,shipping:'Tracked · 4–7 days',address:'Portland, Oregon',payment:'Settled',inventory:'Consumed',events:[['10:42','Order received','Inventory reserved'],['10:43','Invoice created','51,500 sats · expires in 15 minutes'],['10:46','Payment settled','Reservation consumed; stock decremented'],['10:47','Confirmation sent','Customer and merchant notified']]},
      {id:'G-8A1F',channel:'Gamma',buyer:'npub1buyer…7xq',state:'awaiting',label:'Awaiting payment',total:72000,item:'Relay Field Jacket',variant:'Moss / M',qty:1,shipping:'Tracked · 5–8 days',address:'Encrypted · available to owner',payment:'Pending',inventory:'Held until 11:28',events:[['11:13','NIP-17 order received','Outer, seal, and rumor verified'],['11:13','Inventory reserved','One unit held'],['11:14','Payment request delivered','Recipient and sender copies acknowledged']]},
      {id:'NRG-1039',channel:'Web',buyer:'mira@example.com',state:'exception',label:'Needs attention',total:24000,item:'Nostr Field Notes',variant:'Ochre / 3 pack',qty:1,shipping:'Tracked · 3–5 days',address:'Austin, Texas',payment:'Settled after cancellation',inventory:'Released',events:[['09:06','Order received','Inventory reserved'],['09:10','Buyer cancelled','Reservation released'],['09:13','Late payment detected','Order stayed cancelled; exception opened']]},
      {id:'N15-77',channel:'NIP-15',buyer:'npub1legacy…3pk',state:'cancelled',label:'Cancelled',total:18500,item:'Market Tote',variant:'Natural canvas',qty:1,shipping:'Legacy zone · unverified address',address:'Legacy physical order rejected',payment:'Not created',inventory:'Not reserved',events:[['Yesterday','Legacy order received','Opaque physical address'],['Yesterday','Order rejected','Machine-readable destination required']]}
    ];
    let orders = structuredClone(originalOrders), selectedId = 'NRG-1042', search = '', filter = 'all', dataMode = 'populated', annotations = false;
    const statuses = ['confirmed','awaiting','exception','cancelled'];
    function orderById(id){ return orders.find(o=>o.id===id) || orders[0]; }
    function sidebarMarkup(){ return '<div class="brand"><span class="brand-mark">γ</span><span>gammamarkets</span></div><div class="merchant"><strong>North Relay Goods</strong><small>Wallet connected · catalog active</small></div><nav class="side-nav" aria-label="Merchant navigation"><button><b>⌂</b><span>Overview</span></button><button><b>▦</b><span>Catalog</span></button><button class="active"><b>≡</b><span>Orders</span></button><button><b>↗</b><span>Publications</span></button><button><b>◉</b><span>Relay health</span></button><button><b>⚙</b><span>Settings</span></button></nav>'; }
    function filteredOrders(){ return orders.filter(o=>(filter==='all'||o.state===filter)&&(`${o.id} ${o.buyer} ${o.item}`.toLowerCase().includes(search.toLowerCase()))); }
    function status(o){ return `<span class="status ${o.state}">${o.label}</span>`; }
    function rowMarkup(o){ return `<button class="order-row ${o.id===selectedId?'active':''}" onclick="selectOrder('${o.id}')"><div><div class="row-title"><span>${o.id}</span><span class="protocol">${o.channel}</span></div><div class="row-meta">${o.buyer}<br>${o.item} · ${o.qty} item</div></div><div><div class="row-total">${money(o.total)}</div><div style="margin-top:9px">${status(o)}</div></div></button>`; }
    function actionButtons(o){ if(o.state==='exception') return `<button class="primary" onclick="resolveException('${o.id}','accept')">Accept paid order</button><button class="secondary danger" onclick="resolveException('${o.id}','refund')">Request refund</button>`; if(o.state==='confirmed') return `<button class="primary" onclick="advance('${o.id}','processing')">Start processing</button><button class="secondary danger" onclick="advance('${o.id}','cancelled')">Cancel with reason</button>`; if(o.state==='processing') return `<button class="primary" onclick="advance('${o.id}','shipped')">Mark shipped</button>`; if(o.state==='awaiting') return `<button class="secondary" onclick="toast('Payment status reconciled')">Reconcile payment</button>`; return `<button class="secondary" disabled>No legal action</button>`; }
    function detailMarkup(o, timelineFirst=false){ const alert=o.state==='exception'?`<div class="alert"><div><strong>Late payment after cancellation</strong><p>Funds settled, but released stock was not consumed. Choose an explicit resolution.</p></div>${status(o)}</div>`:''; const summary=`<div class="metrics"><div class="metric"><span>Total</span><strong>${money(o.total)}</strong></div><div class="metric"><span>Payment</span><strong>${o.payment}</strong></div><div class="metric"><span>Inventory</span><strong>${o.inventory}</strong></div><div class="metric"><span>Protocol</span><strong>${o.channel}</strong></div></div>`; const items=`<div class="panel"><h2>Items</h2><div class="item"><div class="item-art"></div><div><strong>${o.item}</strong><br><span class="row-meta">${o.variant} · qty ${o.qty}</span></div><strong>${money(o.total-3500)}</strong></div><div class="kv"><span>Shipping</span><span>${o.shipping}</span></div><div class="kv"><span>Destination</span><span>${o.address}</span></div></div>`; const events=`<div class="panel"><h2>Order timeline</h2><div class="timeline">${o.events.map(e=>`<div class="event"><strong>${e[1]}</strong><time>${e[0]}</time><p>${e[2]}</p></div>`).join('')}</div><details><summary>Technical delivery details</summary><div class="technical">order_ref=${o.id}<br>payment_truth=LNbits core<br>relay_ack_evidence=${o.channel==='Gamma'?'recipient+sender':'not applicable'}<br>no private keys, payment hashes, or bearer tokens displayed</div></details></div>`; return `<div class="detail-card"><button class="secondary mobile-back" onclick="backToOrders()">← Back to orders</button><div class="detail-heading"><div><p class="eyebrow">${o.channel} order</p><h1>${o.id}</h1><p>${o.buyer} · ${o.item}</p></div>${status(o)}</div>${alert}<div class="action-row">${actionButtons(o)}<button class="secondary" onclick="toast('Audit export prepared')">Export audit</button></div><div style="height:20px"></div>${summary}<div class="detail-grid">${timelineFirst?events+items:items+events}</div></div>`; }
    function render(){ document.querySelectorAll('.sidebar').forEach(el=>el.innerHTML=sidebarMarkup()); if(dataMode!=='populated'){ renderDataMode(); return; } const list=filteredOrders(); document.querySelector('[data-list="a"]').innerHTML=list.length?list.map(rowMarkup).join(''):'<div class="empty-state"><h2>No matching orders</h2><p>Adjust search or status filters.</p></div>'; const current=orderById(selectedId); document.querySelector('[data-detail="a"]').innerHTML=detailMarkup(current); renderBoard(); renderRail(); document.querySelector('[data-detail="c"]').innerHTML=detailMarkup(current,true); }
    function renderBoard(){ const columns=[['awaiting','Awaiting payment'],['confirmed','Paid'],['exception','Attention'],['cancelled','Closed']]; document.querySelector('[data-board="b"]').innerHTML=columns.map(([state,title])=>{const rows=orders.filter(o=>o.state===state||state==='confirmed'&&['processing','shipped'].includes(o.state));return `<section class="column"><div class="column-head"><span>${title}</span><span class="count">${rows.length}</span></div>${rows.map(o=>`<button class="order-card" onclick="openDrawer('${o.id}')"><div class="card-top"><strong>${o.id}</strong><span class="protocol">${o.channel}</span></div><p>${o.item}</p><div class="card-top"><span>${status(o)}</span><strong>${money(o.total)}</strong></div></button>`).join('')||'<p class="row-meta">Queue clear</p>'}</section>`}).join(''); }
    function renderRail(){ document.querySelector('[data-rail="c"]').innerHTML='<h2>Recent orders</h2>'+orders.map(o=>`<button class="queue-button ${o.id===selectedId?'active':''}" onclick="selectOrder('${o.id}')"><strong>${o.id} · ${money(o.total)}</strong><span>${o.label} · ${o.events.length} events</span></button>`).join(''); }
    function renderDataMode(){ const markup=dataMode==='empty'?'<div class="empty-state"><h2>No orders yet</h2><p>New web and protocol orders will appear here.</p></div>':'<div class="error-state"><h2>Orders could not be loaded</h2><p>The durable queue remains safe. Retry without changing order state.</p><button class="primary" onclick="cycleDataMode()">Retry</button></div>'; document.querySelector('[data-list="a"]').innerHTML=markup; document.querySelector('[data-detail="a"]').innerHTML=''; document.querySelector('[data-board="b"]').innerHTML=markup; document.querySelector('[data-rail="c"]').innerHTML=markup; document.querySelector('[data-detail="c"]').innerHTML=''; }
    function selectOrder(id){ selectedId=id; render(); const frame=document.getElementById('sketch-frame'); const active=document.querySelector('.variant.active'); if(frame.classList.contains('preview-mobile')||innerWidth<=560) active.classList.add('mobile-detail-open'); }
    function backToOrders(){ document.querySelectorAll('.variant').forEach(el=>el.classList.remove('mobile-detail-open')); }
    function setSearch(value){ search=value; render(); }
    function setFilter(value){ filter=value; render(); }
    function openDrawer(id){ selectedId=id; document.querySelector('[data-detail="b"]').innerHTML=detailMarkup(orderById(id)); document.querySelector('[data-drawer]').classList.add('open'); }
    function closeDrawer(event,force=false){ if(force||event.target===document.querySelector('[data-drawer]')) document.querySelector('[data-drawer]').classList.remove('open'); }
    function advance(id,next){ const o=orderById(id); o.state=next; o.label=next==='processing'?'Processing':next==='shipped'?'Shipped':'Cancelled'; o.events.push(['Now',o.label,'Updated by authenticated merchant']); render(); toast(`${id} moved to ${o.label}`); }
    function advanceSelected(next){ advance(selectedId,next); }
    function resolveException(id,action){ const o=orderById(id); if(action==='accept'){o.state='confirmed';o.label='Confirmed';o.inventory='Backorder review';o.events.push(['Now','Late payment accepted','Merchant accepted fulfillment responsibility']);}else{o.label='Refund requested';o.events.push(['Now','Refund requested','Manual wallet refund required']);} render(); toast(`Exception updated for ${id}`); }
    function focusException(){ const o=orders.find(x=>x.state==='exception'); if(o){selectedId=o.id;render();const active=document.querySelector('.variant.active').id;if(active==='variant-b')openDrawer(o.id);} }
    function cycleDataMode(){ dataMode=dataMode==='populated'?'empty':dataMode==='empty'?'error':'populated';render();toast(`Data state: ${dataMode}`); }
    function resetData(){ orders=structuredClone(originalOrders);selectedId='NRG-1042';search='';filter='all';dataMode='populated';document.querySelectorAll('[data-search]').forEach(e=>e.value='');document.querySelectorAll('[data-filter]').forEach(e=>e.value='all');render();toast('Orders reset'); }
    function money(v){return v.toLocaleString('en-US')+' sats';}
    function showVariant(key,button){document.querySelectorAll('.variant').forEach(e=>e.classList.remove('active'));document.querySelectorAll('.variant-tab').forEach(e=>e.classList.remove('active'));document.getElementById('variant-'+key).classList.add('active');button.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
    function setTheme(file){document.getElementById('theme-link').href='../themes/'+file;toast('Theme changed');}
    function setViewport(width){const frame=document.getElementById('sketch-frame');frame.style.maxWidth=width?width+'px':'none';frame.classList.remove('preview-tablet','preview-mobile');if(width&&width<=820)frame.classList.add('preview-tablet');if(width&&width<=560)frame.classList.add('preview-mobile');toast(width?width+'px preview':'Full width preview');}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(el.timer);el.timer=setTimeout(()=>el.classList.remove('show'),1600);}
    function toggleAnnotations(){annotations=!annotations;document.body.classList.toggle('annotations-on',annotations);document.getElementById('annotations').textContent=annotations?'Annotations on':'Annotations';document.getElementById('annotation-tip').style.display='none';}
    document.addEventListener('mousemove',event=>{if(!annotations)return;const target=event.target.closest('[data-annotate]');const tip=document.getElementById('annotation-tip');if(!target){tip.style.display='none';return;}const s=getComputedStyle(target);tip.textContent=`font ${s.fontSize} · padding ${s.padding} · color ${s.color}`;tip.style.display='block';tip.style.left=Math.min(event.clientX+12,innerWidth-280)+'px';tip.style.top=Math.min(event.clientY+12,innerHeight-60)+'px';});
    render();
  </script>
</body>
</html>
